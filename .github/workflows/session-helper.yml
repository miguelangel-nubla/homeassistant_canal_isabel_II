name: Session helper image

on:
  push:
    branches: ["**"]
    paths:
      - "canal-session-helper/**"
      - ".github/workflows/session-helper.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two builds of the same ref would race for the same tags.
concurrency:
  group: session-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/canal-session-helper
          # A release is tagged with its version: the Home Assistant add-on
          # pulls the image whose tag equals the add-on version.
          tags: |
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=raw,value=latest,enable=${{ github.event_name != 'release' && github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.event_name != 'release' && github.ref != 'refs/heads/main' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: canal-session-helper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  addon-repository:
    # Tell the add-on repository that a new version exists. Needs the secret
    # DISPATCH_TOKEN (a token allowed to dispatch to that repository).
    needs: image
    if: github.event_name == 'release' && !github.event.release.prerelease
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      - if: env.DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/miguelangel-nubla/hassio-repository/dispatches \
            -d '{"event_type":"update","client_payload":{"addon":"canal-session-helper"}}'
