name: Session helper image

# A release starts with the push of its tag (dev/release.sh). The release
# itself, prepared as a draft, is only published once the image of that
# version exists: nobody is offered an integration whose helper is not there
# yet, and a build that fails publishes nothing.
on:
  push:
    branches: ["**"]
    # Path filters do not apply to tags: every v* tag runs this.
    tags: ["v*"]
    paths:
      - "canal-session-helper/**"
      - "tests/helper/**"
      - ".github/workflows/session-helper.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# Two builds of the same ref would race for the same tags.
concurrency:
  group: session-helper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    # The image's browser logs in to a fake portal (tests/helper).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tests/helper/e2e.py

  image:
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Releases are tagged "v<version>" (v2026.11.2). The add-on pulls the
      # image whose tag equals its version, which has no leading "v".
      - id: version
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"
      # One description for the add-on store and for the image: the one in
      # the add-on's config.yaml.
      - id: about
        run: |
          echo "title=$(sed -n 's/^name: //p' canal-session-helper/config.yaml)" >> "$GITHUB_OUTPUT"
          echo "description=$(sed -n 's/^description: //p' canal-session-helper/config.yaml)" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@v5
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
        with:
          images: ghcr.io/${{ github.repository_owner }}/canal-session-helper
          labels: |
            org.opencontainers.image.title=${{ steps.about.outputs.title }}
            org.opencontainers.image.description=${{ steps.about.outputs.description }}
            org.opencontainers.image.documentation=https://github.com/${{ github.repository }}/blob/main/canal-session-helper/DOCS.md
          annotations: |
            org.opencontainers.image.title=${{ steps.about.outputs.title }}
            org.opencontainers.image.description=${{ steps.about.outputs.description }}
          # A release is tagged with its version: the Home Assistant add-on
          # pulls the image whose tag equals the add-on version.
          tags: |
            type=raw,value=${{ steps.version.outputs.value }},enable=${{ github.ref_type == 'tag' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=dev,enable=${{ github.ref_type == 'branch' && github.ref != 'refs/heads/main' }}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: canal-session-helper
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}

  release:
    # The image exists: publish the release that was waiting for it.
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      prerelease: ${{ steps.publish.outputs.prerelease }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - id: publish
        run: |
          if state=$(gh release view "$TAG" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv'); then
            draft=$(echo "$state" | cut -f1)
            prerelease=$(echo "$state" | cut -f2)
            if [ "$draft" = "true" ]; then
              if [ "$prerelease" = "true" ]; then
                gh release edit "$TAG" --draft=false
              else
                gh release edit "$TAG" --draft=false --latest
              fi
            fi
          else
            # A tag pushed without a draft: release it with generated notes.
            gh release create "$TAG" --verify-tag --generate-notes
            prerelease=false
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  addon-repository:
    # Tell the add-on repository that a new version exists. Needs the secret
    # DISPATCH_TOKEN (a token allowed to dispatch to that repository).
    needs: release
    if: needs.release.outputs.prerelease != 'true'
    runs-on: ubuntu-latest
    env:
      DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
    steps:
      - if: env.DISPATCH_TOKEN != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/miguelangel-nubla/hassio-repository/dispatches \
            -d '{"event_type":"update","client_payload":{"app":"canal-session-helper"}}'
