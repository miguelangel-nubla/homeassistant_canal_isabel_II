# Session helper as a plain Docker container. Every setting is explained in
# DOCS.md ("Como contenedor Docker").
services:
  canal-session-helper:
    image: ghcr.io/miguelangel-nubla/canal-session-helper:latest
    # build: .                          # to build it yourself instead
    container_name: canal-session-helper
    restart: unless-stopped
    ports:
      - "6080:6080"                     # remote view of the browser
    environment:
      HA_URL: "http://homeassistant.local:8123"
      HA_TOKEN: "paste-a-long-lived-access-token"
      VNC_PASSWORD: "change-me"
      TZ: "Europe/Madrid"
    volumes:
      - canal-session-data:/data

volumes:
  canal-session-data:
