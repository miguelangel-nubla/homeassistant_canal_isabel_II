services:
  canal-session-helper:
    build: .
    container_name: canal-session-helper
    restart: unless-stopped
    ports:
      - "6080:6080"   # remote view of the browser: http://<host>:6080/vnc.html
    environment:
      HA_URL: "http://homeassistant.local:8123"
      HA_TOKEN: "paste-a-long-lived-access-token"
      VNC_PASSWORD: "change-me"          # VNC only uses the first 8 characters
      # HELPER_URL: "http://nas.local:6080/vnc.html?autoconnect=1&resize=scale"
      # HA_ENTRY_ID: ""                  # only if you have several entries
      # CHECK_INTERVAL: "600"            # seconds between session checks
      # HA_VERIFY_SSL: "true"
      TZ: "Europe/Madrid"
    volumes:
      - canal-session-data:/data
    shm_size: "512m"

volumes:
  canal-session-data:
